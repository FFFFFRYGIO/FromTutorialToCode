[project]
name = "fromtutorialtocode"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "yt-dlp>=2026.7.4",
]

[dependency-groups]
dev = [
    "deptry>=0.25.1",
    "pre-commit>=4.5.1",
]

[tool.ruff.lint]
extend-select = ["I", "UP"]

[tool.mypy]
explicit_package_bases = true

[tool.deptry]
ignore = ["DEP001", "DEP003"]
