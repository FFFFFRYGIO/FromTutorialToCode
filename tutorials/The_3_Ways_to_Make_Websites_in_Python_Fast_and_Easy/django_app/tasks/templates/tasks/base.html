<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Django Tasks{% endblock %}</title>
    <style>
        :root {
            --bg: #0f1117; --card: #1a1d27; --accent: #44b78b;
            --text: #e6e8ee; --muted: #9aa0b0; --border: #2a2e3c;
        }
        * { box-sizing: border-box; }
        body { margin: 0; font-family: system-ui, "Segoe UI", Roboto, sans-serif;
               background: var(--bg); color: var(--text); line-height: 1.5; }
        .nav { display: flex; justify-content: space-between; align-items: center;
               padding: 1rem 2rem; background: var(--card); border-bottom: 1px solid var(--border); }
        .brand { font-weight: 700; font-size: 1.2rem; color: var(--text); text-decoration: none; }
        .nav a.link { color: var(--muted); text-decoration: none; margin-left: 1.2rem; }
        .nav a.link:hover { color: var(--accent); }
        .container { max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
        h1 { margin-top: 0; }
        .muted { color: var(--muted); }
        .add-form { display: flex; gap: 0.5rem; margin: 1.5rem 0; flex-wrap: wrap; }
        .add-form input, .add-form select {
            padding: 0.6rem 0.8rem; border-radius: 8px; border: 1px solid var(--border);
            background: var(--card); color: var(--text); }
        .add-form input[type="text"] { flex: 1; min-width: 200px; }
        button { padding: 0.6rem 1.2rem; border: none; border-radius: 8px;
                 background: var(--accent); color: white; cursor: pointer; font-weight: 600; }
        .task-list { list-style: none; padding: 0; }
        .task { display: flex; align-items: center; gap: 0.6rem; padding: 0.7rem 0.9rem;
                background: var(--card); border: 1px solid var(--border);
                border-radius: 8px; margin-bottom: 0.5rem; }
        .task .title { flex: 1; }
        .task.done .title { text-decoration: line-through; color: var(--muted); }
        .badge { font-size: 0.75rem; padding: 0.1rem 0.5rem; border-radius: 999px;
                 background: var(--border); color: var(--muted); }
        .inline { display: inline; margin: 0; }
        .icon-btn { background: none; border: none; cursor: pointer; font-size: 1.1rem; padding: 0; }
        .messages { list-style: none; padding: 0; }
        .messages li { padding: 0.6rem 0.9rem; border-radius: 8px; margin-bottom: 0.5rem; }
        .messages .success { background: #173a2a; color: #7ee2a8; }
        .messages .error { background: #3a1717; color: #ff9a9a; }
        .footer { text-align: center; color: var(--muted); padding: 2rem; font-size: 0.85rem; }
    </style>
</head>
<body>
    <nav class="nav">
        <a class="brand" href="{% url 'task_list' %}">🎸 Django Tasks</a>
        <div>
            <a class="link" href="{% url 'task_list' %}">Home</a>
            <a class="link" href="/admin/">Admin</a>
        </div>
    </nav>
    <main class="container">
        {% if messages %}
        <ul class="messages">
            {% for message in messages %}
            <li class="{{ message.tags }}">{{ message }}</li>
            {% endfor %}
        </ul>
        {% endif %}
        {% block content %}{% endblock %}
    </main>
    <footer class="footer">Built with Django · The web framework for perfectionists with deadlines</footer>
</body>
</html>
